<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Созвездия — игровое поле ивента</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ctext y=%2214%22 font-size=%2214%22 fill=%22%23ffd23f%22%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">✦</span> <span id="title">Звёздный ивент</span></div>
    <div class="top-actions">
      <button id="btn-undo" title="Отменить последнее действие (Ctrl+Z)">↶ Отменить</button>
      <button id="btn-stream" title="Скрыть панель управления (H)">Режим трансляции</button>
      <button id="btn-settings">⚙ Настройки</button>
    </div>
  </header>

  <main class="layout">
    <section class="sky-wrap">
      <svg id="sky" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid meet">
        <defs>
          <radialGradient id="nebula1" cx="30%" cy="35%" r="45%">
            <stop offset="0" stop-color="#5b2a86" stop-opacity=".45"/>
            <stop offset="1" stop-color="#5b2a86" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="nebula2" cx="75%" cy="70%" r="40%">
            <stop offset="0" stop-color="#1b5e8a" stop-opacity=".45"/>
            <stop offset="1" stop-color="#1b5e8a" stop-opacity="0"/>
          </radialGradient>
          <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
            <feGaussianBlur stdDeviation="6"/>
          </filter>
          <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="2.2" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <rect width="1600" height="1000" fill="url(#nebula1)"/>
        <rect width="1600" height="1000" fill="url(#nebula2)"/>
        <g id="starfield"></g>
        <g id="map"></g>
        <g id="fx"></g>
      </svg>
      <div id="overlay"></div>
      <div id="legend" class="legend"></div>
    </section>

    <aside class="side" id="side">
      <section class="panel">
        <h3>Игроки</h3>
        <div id="players"></div>
        <form id="add-player" class="row">
          <input name="name" placeholder="Имя нового игрока" autocomplete="off">
          <button>+</button>
        </form>
      </section>
      <section class="panel" id="player-panel"></section>
      <section class="panel" id="cons-panel"></section>
      <section class="panel">
        <h3>Журнал</h3>
        <ol id="log"></ol>
      </section>
    </aside>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <div class="tabs" id="tabs"></div>
        <button id="modal-close" class="ghost">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
